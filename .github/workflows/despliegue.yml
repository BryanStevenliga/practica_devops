name: Deploy App

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Descargar código del repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Ejecutar la app
      run: python app.py

    - name: Simular el deploy
      run: echo "Simular que se esta desplegando"

    - name: Construir la imagen de docker
      run: docker build -t ghcr.io/bryanstevenliga/hello-steven:1.0.0 .

    - name: Login en Github container registry
      run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

    - name: Subir la imagen a GitHub Container Registry
      run: docker push ghcr.io/bryanstevenliga/hello-steven:1.0.0